services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      ecommerce_network:
        aliases:
          - rabbitmq
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      ecommerce_network:
        aliases:
          - postgres
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8002:8002"
    command: [ "sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8002" ]
    environment:
      SECRET_KEY: "django-insecure-)v$$sxykalzs8pz2acd4=i!ko*49=69ehp5@e%0+rh4gqajny8&"
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "auth_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      ecommerce_network:
        aliases:
          - auth-service
          - auth_service
    restart: unless-stopped

  product-service:
    build:
      context: ./services/product_service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8001:8001"
    command: [ "sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8001" ]
    environment:
      SECRET_KEY: "django-insecure-tloo#y!v!xa@5$$^ykkf07z%#c9dwu1%fed!k^u^mt%i5xhvbp4"
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "product_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      ecommerce_network:
        aliases:
          - product-service
          - product_service
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment_service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "50051:50051"
    command: [ "python", "server.py" ]
    volumes:
      - ./protos:/protos
    environment:
      SECRET_KEY: "django-insecure-#iw3s=1*6a5byt9@wgl-j^9m$$2h^nj8&6z(ox$$e95o2cw%3e*="
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      GRPC_BIND_ADDR: "0.0.0.0:50051"
      RABBITMQ_HOST: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      ecommerce_network:
        aliases:
          - payment-service
          - payment_service
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8000:8000"
    command: [ "sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000" ]
    volumes:
      - ./protos:/protos
    environment:
      SECRET_KEY: "django-insecure-j++mi!shz$$eu&p1j9s0i5a1&cic_68dshq5_4^g#-_*=lqq-qs"
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PRODUCT_SERVICE_URL: "http://product-service:8001"
      PAYMENT_SERVICE_URL: "payment-service:50051"
      RABBITMQ_HOST: "rabbitmq"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "order_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_HOST: "postgres"
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      ecommerce_network:
        aliases:
          - order-service
          - order_service
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    container_name: notification-service
    command: [ "python", "notifications/consumer.py" ]
    environment:
      RABBITMQ_HOST: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      ecommerce_network:
        aliases:
          - notification-service
          - notification_service
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8003:8003"
    environment:
      SECRET_KEY: "django-insecure-6*=-gqhz%&u4t4tbb8-kx+(!01bkl8115zqtoa1skjqb9))$$fc"
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      AUTH_SERVICE_URL: "http://auth-service:8002/api/auth/"
      JWKS_SERVING_URL: "http://auth-service:8002/.well-known/jwks.json"
      ORDER_SERVICE_URL: "http://order-service:8000/api/orders/"
      PRODUCT_SERVICE_URL: "http://product-service:8001/api/products/"
    depends_on:
      auth-service:
        condition: service_started
      order-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      ecommerce_network:
        aliases:
          - api-gateway
          - api_gateway
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  ecommerce_network:
    driver: bridge
