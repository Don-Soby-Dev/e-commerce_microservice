apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ecommerce/auth-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
          env:
            - name: DB_NAME
              value: "auth_db"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DJANGO_SECRET_KEY
          volumeMounts:
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: certs-volume
          secret:
            secretName: auth-certs-secret
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: auth-service
