name: Build & Publish to GHCR

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pre-publish-tests:
    name: Run Test Suite Before Publishing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - name: auth-service
            dir: services/auth_service
            app: auths
            pythonpath: ""
          - name: product-service
            dir: services/product_service
            app: products
            pythonpath: ""
          - name: order-service
            dir: services/order_service
            app: orders
            pythonpath: protos
          - name: payment-service
            dir: services/payment_service
            app: payments
            pythonpath: protos
          - name: notification-service
            dir: services/notification_service
            app: notifications
            pythonpath: ""
          - name: api-gateway
            dir: services/api_gateway
            app: apis
            pythonpath: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service.dir }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service.dir }}/requirements.txt

      - name: Run service unit tests
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-django-insecure-test-key-safe-for-automated-tests' }}
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
        run: |
          cd ${{ matrix.service.dir }}
          if [ -n "${{ matrix.service.pythonpath }}" ]; then
            export PYTHONPATH="${{ github.workspace }}/${{ matrix.service.pythonpath }}:${PYTHONPATH:-}"
          fi
          python manage.py test ${{ matrix.service.app }}

  build-and-publish:
    name: Build & Publish ${{ matrix.service.name }}
    needs: pre-publish-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            dir: services/auth_service
          - name: product-service
            dir: services/product_service
          - name: payment-service
            dir: services/payment_service
          - name: order-service
            dir: services/order_service
          - name: notification-service
            dir: services/notification_service
          - name: api-gateway
            dir: services/api_gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image repository name
        id: prep
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_OWNER}/ecommerce-${{ matrix.service.name }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
